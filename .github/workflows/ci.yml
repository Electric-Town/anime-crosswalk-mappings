name: CI

# `pull_request`, never `pull_request_target`. The latter runs fork-controlled content
# with a write token, which on a public repository that invites data contributions is
# the single largest thing that could go wrong here.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # More than one interpreter from the start. Determinism across environments is a
        # correctness property for this project, because consumers verify a published hash,
        # and a check that only ever runs on one version cannot see the difference.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Namespace registry and resolution policy are internally consistent
        run: python3 tools/validate_registry_files.py

      - name: Every path the documentation references exists
        run: python3 tools/check_docs.py

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::$sha is not signed off"
              git log -1 --format='  %h %s' "$sha"
              missing=1
            fi
          done < <(git rev-list "$BASE".."$HEAD")

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Contributions are dedicated to the public domain under CC0-1.0, and the"
            echo "sign-off is how that is certified. See CONTRIBUTING.md."
            echo ""
            echo "Fix the most recent commit with:  git commit --amend -s"
            echo "Fix a whole branch with:          git rebase --signoff main"
            exit 1
          fi
          echo "all commits signed off"
