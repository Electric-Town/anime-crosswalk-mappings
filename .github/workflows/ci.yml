name: CI

# `pull_request`, never `pull_request_target`. The latter runs fork-controlled content
# with a write token, which on a public repository that invites data contributions is
# the single largest thing that could go wrong here.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # More than one interpreter from the start. Determinism across environments is a
        # correctness property for this project, because consumers verify a published hash,
        # and a check that only ever runs on one version cannot see the difference.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install pinned dev dependencies
        run: python3 -m pip install --require-hashes -r requirements-dev.lock

      - name: Namespace registry, authority registry and resolution policy are consistent
        run: python3 tools/validate_registry_files.py

      - name: Conformance corpus is well formed and identifier-free
        run: python3 tools/validate_conformance.py

      - name: Schema is valid, enforces the fixtures, and covers every capability
        run: python3 tools/validate_schema.py

      - name: Every path the documentation references exists
        run: python3 tools/check_docs.py

      - name: Validator regression and mutation tests
        run: python3 -m unittest discover -v

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/check_dco.py "$BASE" "$HEAD"
